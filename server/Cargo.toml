[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.7.0"
actix-web = "4"
anyhow = "1.0.104"
blind-rsa-signatures = "0.17.2"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
base64 = "0.21.0"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "macros",
    "uuid",
    "chrono",
] }
env_logger = "0.11.11"
log = "0.4.34"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json", "query"] }
